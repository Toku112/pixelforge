[package]
name = "codecs"
version = "0.1.0"
description = "Image decoders and encoders (PNG, JPEG, WebP) for PixelForge"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
image-webp = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
