[package]
name = "pixel-ops"
version = "0.1.0"
description = "SIMD (and optionally multi-threaded) pixel operations for PixelForge"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Multi-threaded build (rayon on a Web Worker pool). Requires the atomics build
# flags set by scripts/build-wasm.ts; see docs/DECISIONS.md D-003.
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[dependencies]
wasm-bindgen.workspace = true
rayon = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { workspace = true, optional = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
