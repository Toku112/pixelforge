name: Setup
description: Install Node, pnpm, the pinned Rust toolchain, wasm-pack and project dependencies, then build the WASM crates.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    # Installs the nightly pinned in src/wasm/rust-toolchain.toml (with rust-src and the wasm32 target).
    - name: Install Rust toolchain
      shell: bash
      working-directory: src/wasm
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src/wasm

    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Cache wasm-pack tools (wasm-bindgen, wasm-opt)
      uses: actions/cache@v6
      with:
        path: ~/.cache/.wasm-pack
        key: wasm-pack-${{ runner.os }}-${{ hashFiles('src/wasm/Cargo.lock') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build WebAssembly
      shell: bash
      run: pnpm wasm
