name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  checks:
    name: Typecheck, lint, unit & golden tests, Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint, Prettier, rustfmt, clippy, licences)
        run: pnpm lint

      - name: Unit and golden-image tests
        run: pnpm test

      - name: Rust tests
        run: pnpm test:rust

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: tests/golden/__output__/
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: E2E against the dev server
        run: pnpm test:e2e:all

      - name: E2E against a production build
        run: pnpm test:e2e:preview
        env:
          PW_ALL_BROWSERS: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
