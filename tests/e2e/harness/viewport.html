<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Viewport harness</title>
    <style>
      body {
        margin: 0;
      }
      #host {
        position: absolute;
        left: 0;
        top: 0;
        width: 800px;
        height: 600px;
        overflow: hidden;
      }
      #host canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #overlay {
        position: absolute;
        display: none;
        border: 1px dashed #fff;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="host">
      <canvas id="c"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="./viewport.ts"></script>
  </body>
</html>
